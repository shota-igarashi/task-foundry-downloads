<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>社内アプリ</title>
  <link rel="stylesheet" href="styles.css?v=install-guide" />
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">INTERNAL APPS</p>
      <h1>仕事に必要なアプリを、ここから。</h1>
      <p>社内専用アプリの最新版とスマホ版を利用できます。</p>
    </header>
    <section id="apps" class="apps" aria-live="polite"></section>
  </main>
  <script>
    fetch("apps.json?v=1.1.2").then((response) => response.json()).then(({ apps }) => {
      document.querySelector("#apps").innerHTML = apps.map((app) => `
        <article class="card">
          <img src="${app.icon}" alt="" />
          <div class="content">
            <div class="title-row"><h2>${app.name}</h2><span>${app.status}</span></div>
            <p>${app.description}</p>
            <p class="meta">${app.platform} ・ v${app.version} ・ ${app.updatedAt}</p>
            <div class="app-actions">
              <a class="download${app.downloadUrl.startsWith("#") ? " disabled" : ""}" href="${app.downloadUrl}">Mac版をダウンロード</a>
              ${app.mobileUrl ? `<a class="mobile-link" href="${app.mobileUrl}">スマホ版を開く</a>` : ""}
            </div>
            <aside class="install-notice">
              <div class="install-notice-title"><span aria-hidden="true">!</span> Mac版を初めて開く方へ</div>
              <p>「マルウェアが含まれていないことを確認できません」と表示されても、<strong>「ゴミ箱に入れる」は押さないでください。</strong></p>
              <ol>
                <li>画面の「完了」を押します</li>
                <li>Macの「システム設定」→「プライバシーとセキュリティ」を開きます</li>
                <li>下へスクロールし、Task Foundryの「このまま開く」を押します</li>
                <li>確認画面でもう一度「開く」を押します</li>
              </ol>
              <p class="install-note-small">これは社内配布版のためにmacOSが表示する確認です。操作は初回のみ必要です。</p>
            </aside>
          </div>
        </article>`).join("");
    });
  </script>
</body>
</html>
